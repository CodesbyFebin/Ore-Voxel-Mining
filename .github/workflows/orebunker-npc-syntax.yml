name: OreBunker NPC Lua source checks
on:
  workflow_dispatch:
  push:
    paths: ['orebunker-launcher/game/mods/orebunker_assistant/**','.github/workflows/orebunker-npc-syntax.yml']
  pull_request:
    paths: ['orebunker-launcher/game/mods/orebunker_assistant/**','.github/workflows/orebunker-npc-syntax.yml']
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Lua parser
        run: find orebunker-launcher/game/mods/orebunker_assistant -name '*.lua' -print0 | xargs -0 -r luac5.1 -p
