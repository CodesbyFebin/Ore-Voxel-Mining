name: security

on:
  push:
  pull_request:

jobs:
  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test 'security/**/*.test.mjs'
      - run: node security/pq/bench.mjs

  tamarin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tamarin 1.12.0 and Maude 3.5.1
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL -o /tmp/tamarin.tar.gz https://github.com/tamarin-prover/tamarin-prover/releases/download/1.12.0/tamarin-prover-1.12.0-linux64-ubuntu.tar.gz
          tar --no-same-owner -xzf /tmp/tamarin.tar.gz -C "$HOME/bin"
          curl -fsSL -o /tmp/maude.zip https://github.com/maude-lang/Maude/releases/download/Maude3.5.1/Maude-3.5.1-linux-x86_64.zip
          unzip -q /tmp/maude.zip -d "$HOME/bin"
          chmod +x "$HOME/bin/tamarin-prover" "$HOME/bin/maude"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Prove the approval and receipt model
        run: tamarin-prover --prove security/tamarin/edgeore-approval.spthy
